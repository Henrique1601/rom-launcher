[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-cli"
version = "0.3.0"
description = "Next-gen ROM Downloader, Preservation Hub & Desktop GUI Launcher with RetroAchievements, Gamepad Mode & Roulette"
readme = "README.md"
authors = [
    { name = "Henrique Bezerra Dos Santos", email = "henriquebs1601@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "textual>=0.40.0",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
]
full = [
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/Henrique1601/rom-launcher"
Repository = "https://github.com/Henrique1601/rom-launcher"
Issues = "https://github.com/Henrique1601/rom-launcher/issues"

[project.scripts]
rom = "rom_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
