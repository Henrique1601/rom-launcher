[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-cli"
version = "0.2.0"
description = "CLI em Python para buscar e baixar ROMs, ISOs e jogos pelo terminal com TUI interativa."
readme = "README.md"
authors = [{ name = "rom-cli authors" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "textual>=0.40.0",
]

[project.scripts]
rom = "rom_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
